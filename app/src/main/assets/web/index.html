<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>EmuWearGBA</title>
<style>
:root{--bg:#0b1020;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#eef0ff;--mut:#9aa0bd;--a:#9d8cff;--b:#ff6ac1;--ok:#4ade80;--err:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(1200px 600px at 10% -10%,#2a1b6e 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#5a1650 0,transparent 55%),var(--bg);background-attachment:fixed}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 80px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:28px;box-shadow:0 8px 30px rgba(157,140,255,.35)}
h1{margin:0;font-size:26px;letter-spacing:.3px;background:linear-gradient(90deg,#fff,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#drop{padding:34px 18px;text-align:center;border:2px dashed rgba(157,140,255,.55);transition:.2s;cursor:pointer}
#drop.over{background:rgba(157,140,255,.18);transform:scale(1.01);border-color:var(--b)}
#drop .big{font-size:42px;margin-bottom:6px}
#drop b{font-size:18px}
#drop small{display:block;color:var(--mut);margin-top:8px;line-height:1.5}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a),#6d5bff);transition:.15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn.danger{background:rgba(255,107,107,.18);border:1px solid rgba(255,107,107,.5);color:#ffb3b3}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
#queue{margin-top:14px;display:grid;gap:8px}
.job{padding:10px 12px;border-radius:14px;font-size:13px}
.job .t{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.job .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .15s}
.job.done .bar i{background:var(--ok);width:100%!important}
.job.fail .bar i{background:var(--err);width:100%!important}
.sec{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 12px}
.sec h2{margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.game{padding:10px;display:flex;flex-direction:column;gap:8px;transition:.2s}
.game:hover{transform:translateY(-3px);border-color:rgba(157,140,255,.6)}
.cov{aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;background-size:cover;background-position:center}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.game .n{font-weight:650;font-size:14px;line-height:1.25;min-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--mut)}
.tag.s{background:rgba(157,140,255,.25);color:#d9d3ff}
.tag.v{background:rgba(74,222,128,.18);color:#a8f0c4}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:34px;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#1f2540;border:1px solid var(--line);padding:12px 18px;border-radius:14px;transition:.3s;font-size:14px;z-index:9;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎮</div>
    <div><h1>EmuWearGBA</h1><p>Biblioteca de tu reloj · envía juegos, carátulas y partidas</p></div>
  </header>

  <div id="drop" class="card">
    <div class="big">⬆️</div>
    <b>Suelta aquí tus archivos o toca para elegirlos</b>
    <small>Juegos <b>.gba .gb .gbc</b> · Carátulas (imágenes con el mismo nombre del juego) · Partidas <b>.sav</b></small>
    <input id="file" type="file" multiple hidden accept=".gba,.gb,.gbc,.sav,image/*">
  </div>
  <div id="queue"></div>

  <div class="sec">
    <h2>Mis juegos <span id="count" style="color:var(--mut);font-weight:400"></span></h2>
    <button class="btn ghost sm" id="btnCovers">🔎 Buscar carátulas</button>
  </div>
  <div id="lib" class="grid"></div>
</div>
<div id="toast"></div>
<input id="coverPick" type="file" accept="image/*" hidden>

<script>
const $=s=>document.querySelector(s);
const ROM=['gba','gb','gbc'],IMG=['png','jpg','jpeg','webp','gif','bmp'];
const ext=n=>n.split('.').pop().toLowerCase();
const base=n=>n.replace(/\.[^.]+$/,'');
const enc=encodeURIComponent;
let LIB=[];

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in(attrs||{})){
    if(k==='class')e.className=attrs[k];
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));
  return e;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function fmt(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB'}
function hue(s){let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x%360}

function send(url,file,onp){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open('POST',url);
    x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total);
    x.onload=()=>x.status==200?res():rej(new Error(x.responseText||('error '+x.status)));
    x.onerror=()=>rej(new Error('sin conexión con el reloj'));
    x.send(file);
  });
}

function job(name){
  const bar=h('i'),st=h('span',{},'0%');
  const el=h('div',{class:'job card'},h('div',{class:'t'},h('span',{},name),st),h('div',{class:'bar'},bar));
  $('#queue').prepend(el);
  return{
    set(p){bar.style.width=(p*100)+'%';st.textContent=Math.round(p*100)+'%'},
    ok(m){el.classList.add('done');st.textContent=m||'✔ listo';setTimeout(()=>el.remove(),6000)},
    fail(m){el.classList.add('fail');st.textContent='✖ '+m}
  };
}

async function handle(files){
  files=[...files];
  const roms=files.filter(f=>ROM.includes(ext(f.name)));
  const imgs=files.filter(f=>IMG.includes(ext(f.name)));
  const savs=files.filter(f=>ext(f.name)==='sav');
  const others=files.length-roms.length-imgs.length-savs.length;
  if(others)toast(others+' archivo(s) ignorados (formato no válido)');

  for(const f of roms){
    const j=job(f.name);
    try{await send('/upload?name='+enc(f.name),f,j.set);j.ok()}catch(e){j.fail(e.message)}
  }
  await load();
  for(const f of savs){
    const j=job(f.name);
    try{await send('/upload?name='+enc(f.name),f,j.set);j.ok('✔ partida lista')}catch(e){j.fail(e.message)}
  }
  for(const f of imgs){
    const b=base(f.name).toLowerCase();
    let g=LIB.find(x=>x.name.toLowerCase()===b);
    if(!g&&imgs.length===1&&roms.length===1)g=LIB.find(x=>x.file===roms[0].name);
    const j=job(f.name);
    if(!g){j.fail('ningún juego se llama así');continue}
    try{await send('/cover?rom='+enc(g.name),f,j.set);j.ok('✔ carátula lista')}catch(e){j.fail(e.message)}
  }
  await load();
}

async function load(){
  try{LIB=await (await fetch('/api/library')).json()}catch(e){toast('No se pudo leer la biblioteca');return}
  $('#count').textContent=LIB.length?'('+LIB.length+')':'';
  const box=$('#lib');box.textContent='';
  if(!LIB.length){box.style.display='block';box.append(h('div',{class:'empty card'},'Todavía no hay juegos en el reloj. Sube tu primera ROM arriba 👆'));return}
  box.style.display='';
  for(const g of LIB){
    const cov=g.cover
      ?h('div',{class:'cov'},h('img',{src:'/cover?name='+enc(g.name)+'&v='+g.cover_v,alt:''}))
      :h('div',{class:'cov',style:'background:linear-gradient(135deg,hsl('+hue(g.name)+' 55% 42%),hsl('+((hue(g.name)+60)%360)+' 60% 28%))'},g.name.charAt(0).toUpperCase());
    const acts=h('div',{class:'acts'},
      h('button',{class:'btn ghost sm',onclick:()=>pickCover(g)},'🖼 Carátula'),
      g.sav?h('a',{class:'btn ghost sm',href:'/sav?name='+enc(g.name),style:'text-decoration:none'},'💾 Partida'):null,
      h('button',{class:'btn danger sm',onclick:()=>del(g)},'🗑')
    );
    box.append(h('div',{class:'game card'},cov,
      h('div',{class:'n'},g.name.replace(/\s*\(.*?\)/g,'')),
      h('div',{class:'tags'},h('span',{class:'tag s'},g.system),h('span',{class:'tag'},fmt(g.size)),g.sav?h('span',{class:'tag v'},'con partida'):null),
      acts));
  }
}

let target=null;
function pickCover(g){target=g;$('#coverPick').click()}
$('#coverPick').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!target)return;
  const j=job(f.name);
  try{await send('/cover?rom='+enc(target.name),f,j.set);j.ok('✔ carátula lista')}catch(x){j.fail(x.message)}
  load();
});
async function del(g){
  if(!confirm('¿Borrar "'+g.name+'" del reloj? Tus partidas y estados se conservan.'))return;
  const r=await fetch('/delete?file='+enc(g.file),{method:'POST'});
  toast(r.ok?'Juego borrado':'No se pudo borrar');load();
}

const drop=$('#drop'),file=$('#file');
drop.addEventListener('click',()=>file.click());
file.addEventListener('change',()=>{handle(file.files);file.value=''});
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>handle(e.dataTransfer.files));
$('#btnCovers').addEventListener('click',async()=>{
  await fetch('/fetch-covers',{method:'POST'});
  toast('Buscando carátulas… el reloj necesita Wi-Fi con internet');
  setTimeout(load,5000);setTimeout(load,12000);
});
load();
</script>
</body>
</html>
