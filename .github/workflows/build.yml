name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Clonar mGBA
        run: git clone --depth 1 https://github.com/mgba-emu/mgba.git mgba-src

      - name: Compilar el core libretro de mGBA (NDK)
        run: |
          set -e
          NDK="$ANDROID_NDK_LATEST_HOME"
          sudo apt-get update -y && sudo apt-get install -y ninja-build
          for ABI in armeabi-v7a arm64-v8a; do
            cmake -S mgba-src -B build-$ABI -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-30 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF \
              -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF \
              -DUSE_EPOXY=OFF -DUSE_FFMPEG=OFF -DUSE_LIBZIP=OFF -DUSE_EDITLINE=OFF \
              -DUSE_ELF=OFF -DUSE_MAGICK=OFF -DENABLE_SCRIPTING=OFF
            cmake --build build-$ABI -j"$(nproc)"
            SO=$(find build-$ABI -name '*libretro*.so' | head -1)
            [ -n "$SO" ] || { echo "No se generó el .so libretro para $ABI"; exit 1; }
            mkdir -p app/src/main/jniLibs/$ABI
            cp "$SO" app/src/main/jniLibs/$ABI/libmgba_libretro.so
          done
          H=$(find mgba-src -name libretro.h | head -1)
          [ -n "$H" ] || { echo "No se encontró libretro.h"; exit 1; }
          cp "$H" app/src/main/cpp/libretro.h

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mgba-wear-debug
          path: app/build/outputs/apk/debug/app-debug.apk
